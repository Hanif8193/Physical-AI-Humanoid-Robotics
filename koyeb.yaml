app:
  name: physical-ai-backend
  services:
    - name: api
      type: web
      instance_type: small
      regions:
        - fra
      build:
        type: buildpack
        builder: heroku/builder:22
        working_directory: backend
        build_command: pip install --upgrade pip && pip install -r requirements.txt
      run:
        command: uvicorn main:app --host 0.0.0.0 --port $PORT
      ports:
        - port: 8000
          protocol: http
      env:
        - key: PYTHON_VERSION
          value: "3.11"
        - key: PORT
          value: "8000"
      health_checks:
        - path: /health
          protocol: http
          port: 8000
          initial_delay: 10
          interval: 30
          timeout: 5
          grace_period: 30
